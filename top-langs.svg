    }
    .lang-name {
      font: 400 10px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #8b949e;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

