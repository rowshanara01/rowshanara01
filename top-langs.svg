  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 31.01%, CSS 27.83%, JavaScript 22.95%, HTML 5.88%, Blade 3.62%, PHP 3.52%, Python 1.83%, Vue 1.60%, MDX 1.08%, Jupyter Notebook 0.44%, SCSS 0.14%, Shell 0.08%</desc>
  <style>
