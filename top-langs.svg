  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 30.66%, CSS 28.11%, JavaScript 22.86%, HTML 5.93%, Blade 3.66%, PHP 3.56%, Python 1.85%, Vue 1.62%, MDX 1.10%, Jupyter Notebook 0.44%, SCSS 0.14%, Shell 0.08%</desc>
  <style>
