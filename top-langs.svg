<svg
  width="326"
  height="154"
  viewBox="0 0 326 154"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 23.77%, JavaScript 20.34%, CSS 16.76%, PHP 15.69%, Vue 13.84%, Blade 3.32%, HTML 3.17%, Dart 1.18%, Python 0.98%, MDX 0.58%, Jupyter Notebook 0.23%, SCSS 0.13%</desc>
  <style>
    .header {
      font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #58a6ff;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 400 10px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #8b949e;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

