<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Terminal session: Rowshanara Akhter, Full-Stack Software Engineer, service running, 2+ years uptime">
  <title>rowshanara01@production — service status</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", monospace; }
    .fg   { fill: #c9d1d9; }
    .dim  { fill: #8b949e; }
    .blue { fill: #58a6ff; }
    .grn  { fill: #3fb950; }
    .amb  { fill: #e3b341; }
    .type { clip-path: inset(0 100% 0 0); animation: type .85s steps(36, end) forwards; }
    .slide { opacity: 0; transform: translateY(6px); animation: slideIn .45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .fade { opacity: 0; animation: fadeIn .45s ease-out forwards; }
    
    .d0 { animation-delay: .2s }
    .d1 { animation-delay: 1.1s }
    .d2 { animation-delay: 1.5s }
    .d3 { animation-delay: 1.85s }
    .d4 { animation-delay: 2.3s }
    .d5 { animation-delay: 3.25s }
    .d6 { animation-delay: 3.7s }
    .d7 { animation-delay: 4.15s }
    .d8 { animation-delay: 4.6s }
    .d9 { animation-delay: 5.05s }
    .cursor { opacity: 0; animation: fadeIn .1s 5.5s forwards, blink 1.06s 5.55s steps(1, end) infinite; }
    .led    { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s 4.4s ease-in-out infinite; }

    @keyframes type    { to { clip-path: inset(0 0 0 0) } }
    @keyframes slideIn { to { opacity: 1; transform: translateY(0) } }
    @keyframes fadeIn  { to { opacity: 1 } }
    @keyframes blink   { 50% { opacity: 0 } }
    @keyframes pulse   { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
    @media (prefers-reduced-motion: reduce) {
      .type, .slide, .fade, .cursor, .led { animation: none; clip-path: none; opacity: 1; transform: none }
    }
  </style>

  <rect x="1" y="1" width="898" height="358" rx="12" fill="#0d1117" stroke="#21262d"/>
