<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="Terminal session: Rowshanara Akhter, Full-Stack Software Engineer, service running, 2+ years uptime">
  <title>rowshanara01@production — service status</title>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", monospace; }
    .fg   { fill: #c9d1d9; }
    .dim  { fill: #8b949e; }
    .blue { fill: #58a6ff; }
    .grn  { fill: #3fb950; }
    .amb  { fill: #e3b341; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="898" height="346" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v25H1z" fill="url(#headerGrad)"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="26" cy="20" r="5.5" fill="#f85149"/>
  <circle cx="46" cy="20" r="5.5" fill="#e3b341"/>
  <circle cx="66" cy="20" r="5.5" fill="#3fb950"/>
  <text class="mono dim" x="450" y="24.5" font-size="12" text-anchor="middle">rowshanara01@production — ssh — 90×24</text>

  <!-- Session Open -->
  <g class="mono" font-size="14.5">
    <text x="28" y="72"><tspan class="grn">➜</tspan><tspan class="fg" dx="10">ssh rowshanara01@production</tspan></text>
    <text class="dim" x="28" y="96">key accepted · session opened · 2 min ago</text>
  </g>

  <!-- Identity Hero Title (100% visible by default, crisp and glowing) -->
  <g class="mono">
    <text class="blue" x="28" y="146" font-size="28" font-weight="700" letter-spacing="1.5">ROWSHANARA AKHTER</text>
    <text class="dim" x="28" y="170" font-size="13">Full-Stack Software Engineer · EasilyPro · Dhaka, Bangladesh · 2+ years shipping</text>
  </g>

  <!-- Status Section (100% visible 24/7 with zero downtime) -->
  <g class="mono" font-size="14.5">
    <text x="28" y="212"><tspan class="grn">➜</tspan><tspan class="fg" dx="10">systemctl status rowshanara01.service</tspan></text>
    
    <!-- Active Status with Pulsing Green LED Indicator (SMIL + CSS) -->
    <g>
      <circle cx="33" cy="231" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text class="fg" x="48" y="236">rowshanara01.service <tspan class="dim">— architecting intelligent agentic workflows & high-performance SaaS platforms</tspan></text>
    </g>

    <text x="48" y="260" font-size="13.5"><tspan class="dim">Active:   </tspan><tspan class="grn" font-weight="600">running</tspan><tspan class="dim"> (accepting requests)</tspan></text>
    <text x="48" y="282" font-size="13.5"><tspan class="dim">Runtime:  </tspan><tspan class="fg">React · Next.js · TypeScript · Node.js · Express · MongoDB</tspan></text>
    <text x="48" y="304" font-size="13.5"><tspan class="dim">Focus:    </tspan><tspan class="fg">multi-tenant SaaS · agentic AI · robust API design</tspan></text>
    
    <!-- Live Prompt with Blinking Amber Cursor -->
    <text x="28" y="330">
      <tspan class="grn">➜</tspan><tspan class="amb" dx="10">open to collaborate &amp; hire</tspan>
      <tspan class="amb" dx="6">▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
  </g>
</svg>