<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="Terminal session: Rowshanara Akhter, Full-Stack Software Engineer, service running, 2+ years uptime">
  <title>rowshanara01@production — service status</title>
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Clip Paths for Terminal Line Typing -->
    <clipPath id="clip-line-1">
      <rect x="28" y="55" width="0" height="25">
        <animate attributeName="width" values="0;0;320;320;320" keyTimes="0;0.04;0.18;0.95;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip-line-cmd2">
      <rect x="28" y="195" width="0" height="25">
        <animate attributeName="width" values="0;0;380;380;380" keyTimes="0;0.28;0.42;0.95;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clip-line-cmd3">
      <rect x="28" y="312" width="0" height="25">
        <animate attributeName="width" values="0;0;300;300;300" keyTimes="0;0.58;0.72;0.95;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", monospace; }
    .fg   { fill: #c9d1d9; }
    .dim  { fill: #8b949e; }
    .blue { fill: #58a6ff; }
    .grn  { fill: #3fb950; }
    .amb  { fill: #e3b341; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="898" height="346" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v25H1z" fill="url(#headerGrad)"/>
  <line x1="1" y1="38" x2="899" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="26" cy="20" r="5.5" fill="#f85149"/>
  <circle cx="46" cy="20" r="5.5" fill="#e3b341"/>
  <circle cx="66" cy="20" r="5.5" fill="#3fb950"/>
  <text class="mono dim" x="450" y="24.5" font-size="12" text-anchor="middle">rowshanara01@production — ssh — 90×24</text>

  <!-- Line 1: Typing Command 1 -->
  <g class="mono" font-size="14.5" clip-path="url(#clip-line-1)">
    <text x="28" y="72"><tspan class="grn">➜</tspan><tspan class="fg" dx="10">ssh rowshanara01@production</tspan></text>
  </g>

  <!-- Session Response Message -->
  <g class="mono" font-size="14.5">
    <text class="dim" x="28" y="96">key accepted · session opened · 2 min ago
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.22;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Identity Hero Title -->
  <g class="mono">
    <text class="blue" x="28" y="146" font-size="28" font-weight="700" letter-spacing="1.5">ROWSHANARA AKHTER
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.26;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text class="dim" x="28" y="170" font-size="13">Full-Stack Software Engineer · EasilyPro · Dhaka, Bangladesh · 2+ years shipping
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.28;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Line 2: Typing Command 2 (systemctl status) -->
  <g class="mono" font-size="14.5" clip-path="url(#clip-line-cmd2)">
    <text x="28" y="212"><tspan class="grn">➜</tspan><tspan class="fg" dx="10">systemctl status rowshanara01.service</tspan></text>
  </g>

  <!-- Service Details & Status Indicator -->
  <g class="mono">
    <!-- Active Status Line with Pulsing Green LED -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.95;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="33" cy="231" r="4.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5;5.5;4.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text class="fg" x="46" y="236" font-size="14.5">rowshanara01.service <tspan class="dim">— architecting intelligent agentic workflows &amp; high-performance SaaS</tspan></text>
    </g>

    <text x="46" y="260" font-size="13.5">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.50;0.95;1" dur="8s" repeatCount="indefinite"/>
      <tspan class="dim">Active   </tspan><tspan class="grn">running</tspan><tspan class="dim"> (accepting requests)</tspan>
    </text>

    <text x="46" y="282" font-size="13.5">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.54;0.95;1" dur="8s" repeatCount="indefinite"/>
      <tspan class="dim">Runtime  </tspan><tspan class="fg">React · Next.js · TypeScript · Node.js · Express · MongoDB</tspan>
    </text>

    <text x="46" y="304" font-size="13.5">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.58;0.95;1" dur="8s" repeatCount="indefinite"/>
      <tspan class="dim">Focus    </tspan><tspan class="fg">multi-tenant SaaS · agentic AI · robust API design</tspan>
    </text>
  </g>

  <!-- Line 3: Typing Command 3 (collaborate & hire) with Blinking Cursor -->
  <g class="mono" font-size="14.5">
    <g clip-path="url(#clip-line-cmd3)">
      <text x="28" y="330"><tspan class="grn">➜</tspan><tspan class="amb" dx="10">open to collaborate &amp; hire</tspan></text>
    </g>
    <!-- Always blinking prompt cursor at the active command line -->
    <text x="270" y="330" class="amb">▌
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>