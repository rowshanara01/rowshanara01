    <text class="slide d7" x="46" y="286" font-size="13.5"><tspan class="dim">Runtime: </tspan><tspan class="fg">React · Next.js · TypeScript · Node.js · Express · MongoDB</tspan></text>
    <text class="slide d8" x="46" y="310" font-size="13.5"><tspan class="dim">Focus:   </tspan><tspan class="fg">multi-tenant SaaS · agentic AI · robust API design</tspan></text>
    <text class="type d9" x="28" y="336"><tspan class="grn">➜</tspan><tspan class="amb" dx="10">open to collaborate &amp; hire</tspan></text>
