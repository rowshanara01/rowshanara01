<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="New Year Style Celebration Fireworks for Rowshanara Akhter">
  <title>New Year Style Celebration Fireworks — @rowshanara01</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="25%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>

    <!-- Radial Glows for Fireworks -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5a6" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff9100" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ff007f" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#b026ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0077ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", "Fira Code", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    /* Star Twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .star-1 { animation: twinkle 2s infinite ease-in-out; transform-origin: center; }
    .star-2 { animation: twinkle 3.1s infinite ease-in-out 0.7s; transform-origin: center; }
    .star-3 { animation: twinkle 2.5s infinite ease-in-out 1.2s; transform-origin: center; }

    /* Burst 1: Golden Burst (Left: x=190, y=90) */
    @keyframes rocket-1 {
      0% { transform: translateY(160px); opacity: 1; stroke-dashoffset: 40; }
      22% { transform: translateY(0); opacity: 1; stroke-dashoffset: 0; }
      23%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes flash-1 {
      0%, 22% { opacity: 0; transform: scale(0.1); }
      25% { opacity: 1; transform: scale(1.4); }
      38%, 100% { opacity: 0; transform: scale(2.2); }
    }
    @keyframes sparks-1 {
      0%, 22% { opacity: 0; transform: scale(0.05); }
      26% { opacity: 1; }
      46% { opacity: 0.9; }
      60%, 100% { opacity: 0; transform: scale(1.35) translateY(12px); }
    }

    /* Burst 2: Magenta & Purple (Center: x=450, y=65) */
    @keyframes rocket-2 {
      0%, 28% { transform: translateY(180px); opacity: 0; }
      29% { opacity: 1; stroke-dashoffset: 40; }
      50% { transform: translateY(0); opacity: 1; stroke-dashoffset: 0; }
      51%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes flash-2 {
      0%, 50% { opacity: 0; transform: scale(0.1); }
      53% { opacity: 1; transform: scale(1.5); }
      66%, 100% { opacity: 0; transform: scale(2.4); }
    }
    @keyframes sparks-2 {
      0%, 50% { opacity: 0; transform: scale(0.05); }
      54% { opacity: 1; }
      74% { opacity: 0.9; }
      88%, 100% { opacity: 0; transform: scale(1.4) translateY(14px); }
    }

    /* Burst 3: Electric Cyan & Mint (Right: x=710, y=85) */
    @keyframes rocket-3 {
      0%, 55% { transform: translateY(160px); opacity: 0; }
      56% { opacity: 1; stroke-dashoffset: 40; }
      75% { transform: translateY(0); opacity: 1; stroke-dashoffset: 0; }
      76%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes flash-3 {
      0%, 75% { opacity: 0; transform: scale(0.1); }
      78% { opacity: 1; transform: scale(1.4); }
      90%, 100% { opacity: 0; transform: scale(2.2); }
    }
    @keyframes sparks-3 {
      0%, 75% { opacity: 0; transform: scale(0.05); }
      79% { opacity: 1; }
      93% { opacity: 0.9; }
      100% { opacity: 0; transform: scale(1.35) translateY(12px); }
    }

    /* Global loop of 4.5 seconds */
    .r-tail-1 { animation: rocket-1 4.5s infinite linear; }
    .flash-b1 { animation: flash-1 4.5s infinite ease-out; transform-origin: 190px 90px; }
    .burst-g1 { animation: sparks-1 4.5s infinite ease-out; transform-origin: 190px 90px; }

    .r-tail-2 { animation: rocket-2 4.5s infinite linear; }
    .flash-b2 { animation: flash-2 4.5s infinite ease-out; transform-origin: 450px 65px; }
    .burst-g2 { animation: sparks-2 4.5s infinite ease-out; transform-origin: 450px 65px; }

    .r-tail-3 { animation: rocket-3 4.5s infinite linear; }
    .flash-b3 { animation: flash-3 4.5s infinite ease-out; transform-origin: 710px 85px; }
    .burst-g3 { animation: sparks-3 4.5s infinite ease-out; transform-origin: 710px 85px; }

    /* Badge Pulsing Glow */
    @keyframes badge-glow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(255, 215, 0, 0.6)); }
    }
    .badge-card { animation: badge-glow 3s infinite ease-in-out; }
  </style>

