  <circle cx="450" cy="65" r="32" fill="url(#pinkGlow)" class="flash-b2"/>
  <circle cx="450" cy="65" r="42" stroke="#ff77c6" stroke-width="1.5" fill="none" class="flash-b2"/>
  <g class="burst-g2">
