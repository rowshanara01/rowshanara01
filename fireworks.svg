    <line x1="190" y1="90" x2="190" y2="40" stroke="#ffd700" stroke-width="1.2" opacity="0.7"/>
    <line x1="190" y1="90" x2="228" y2="60" stroke="#ffaa00" stroke-width="1.2" opacity="0.7"/>
    <line x1="190" y1="90" x2="238" y2="90" stroke="#ffd700" stroke-width="1.2" opacity="0.7"/>
